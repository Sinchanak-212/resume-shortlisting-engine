[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#050a18"
secondaryBackgroundColor = "#0b1226"
textColor = "#e8eefc"
font = "sans serif"

[server]
# Streamlit's file watcher walks torch's lazy modules and makes startup/reruns very slow on Windows
fileWatcherType = "none"

[browser]
gatherUsageStats = false
